plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    // datagen cache files. NOTE: the resource-relative path is ".cache/<hash>",
    // so the previous pattern "src/generated/**/.cache" never matched anything and
    // 6 cache files were shipping inside the released jar. Both the bare and the
    // nested form are excluded, whichever srcDir produced them.
    exclude(".cache/**")
    exclude("**/.cache/**")
}

// ── P7c：共享数据包资源（core/src/main/resources/data/**）也是根 jar 的资源 ────────────────
// P7c 把 27 个根侧手写 data/** 里「引用全是原版/外部命名空间、或横跨两层」的 5 个共享文件
// git mv 到 core/src/main/resources/data/**（见 buildSrc/coe-conventions.gradle 的 P7c 段，
// 三个模块 jar 用同一行把该目录登记成自己的资源目录）。
// 根工程这里补同一条：dev 期根 mod 文件本来就已经通过 neoForge.mods{} 的
// `sourceSet(project(':core').sourceSets.main)` 合并拿到 core 的 resources 输出，但**根 jar
// 自己的顶层**不会因为那一条而带上它们（那一条只写 -Dfml.modFolders）。照 AGENTS 的构建流程
// 交付的是根 jar，所以这里显式登记，让"根 jar 顶层 / 模块 jar 顶层"两种形态一致。
sourceSets.main.resources.srcDir project(':core').file('src/main/resources')

repositories {
    // 内置内核 Skiller 的本地 maven 仓库（libs-maven/，随仓库提交）。
    // 用 maven 布局而不是 files(...) 的原因：JarJar 需要 group/artifact/version 元数据，
    // file 依赖会让 metadata.json 里的版本退化成文件哈希。
    maven { url = uri("libs-maven") }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
    maven { url = "https://cursemaven.com/"}
    maven { url = "https://api.modrinth.com/maven" } // Jade（可选集成）
    // Add here additional repositories if required by some of the dependencies below.

//    maven {
//        url = "https://cursemaven.com/"
//
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ⚠ 跨项目读 source set 之前先确认求值顺序：根工程先求值，此时 project(':core').sourceSets
// 会**落回根工程自己的扩展**（实测 srcDirs/classesDirs 都报成根工程的路径）。
// 一行 evaluationDependsOn 即可修正——下面 neoForge.mods{} 里要读 core / coe 的 sourceSets。
evaluationDependsOn(':core')
// P3w：同上，:coe 的 sourceSets 也要跨项目读（它是 createoreexpansion 那个 mod 文件）。
evaluationDependsOn(':coe')
// P3y：同上，:transmutation 的 sourceSets 也要跨项目读（它是 transmutation 那个 mod 文件）。
evaluationDependsOn(':transmutation')
// P3z：同上，:cews 的 sourceSets 也要跨项目读（它是 cews 那个 mod 文件）。
// 跨项目依赖链是单向的 root → :coe / :cews / :transmutation → :core，没有环（P3y 探针实测）。
evaluationDependsOn(':cews')

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
//     accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            //
            // ── P4a：三个内容模块的手写资源也是 datagen 的「existing」输入 ──────────────────────
            // 背景（NeoForge 源码里的注释就写着这一条）：GatherDataEvent#DataGeneratorConfig 建
            // ExistingFileHelper 用的资源管理器时，会把**正在生成的那个 mod**（这里是
            // createoreexpansion）的资源包**排除掉**（"ignore actively generated models, their
            // resource packs should be included using --existing <packPath>"）。
            // P4a 把 models/block/**、textures/** 搬进 <module>/src/main/resources 之后，这些文件在
            // dev 里就属于 :coe / :cews / :transmutation 这三个 mod 文件（其中 :coe 的 mod id 正是
            // createoreexpansion）——不显式加 --existing，datagen 的 ExistingFileHelper 就找不到
            // 手写模型，BlockModelProvider 会抛 "Model ... does not exist"。
            // 已有的那行 '--existing src/main/resources/' 继续保留（根工程仍有 data/** 等手写资源）。
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing', file('coe/src/main/resources/').getAbsolutePath(),
                    '--existing', file('cews/src/main/resources/').getAbsolutePath(),
                    '--existing', file('transmutation/src/main/resources/').getAbsolutePath(),
                    '--existing-mod', 'create'

            // ── P4a：每层的 datagen 输出根（blockstates / models 改写到各自的模块目录）────────────
            // datagen 只有一个 --output 根，三层 Registrate 的注册命名空间又必须都是
            // createoreexpansion（NeoForge 只为 --mod 指定的那个 mod 跑生成器），所以"按模块分家"
            // 只能由集成层的 datagen 入口自己改写落盘路径：
            //   core/.../common/registry/LayerDataProvider#run(CachedOutput) 用一个把
            //   assets/<ns>/blockstates/** 与 assets/<ns>/models/** 从根输出换到本层输出的
            //   CachedOutput 包一层；lang/** 与 data/** 仍留在根工程。
            // 路径是**构建期**知识，所以由这一行交给运行时；取不到时 Java 侧不改写（退化成旧行为）。
            systemProperty 'coe.datagen.layerAssetRoots',
                    "coe=${file('coe/src/generated/resources').absolutePath};cews=${file('cews/src/generated/resources').absolutePath};transmutation=${file('transmutation/src/generated/resources').absolutePath}"
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        //
        // ── P3w：dev 的 mod 文件 = 这个映射的**每个条目**（不是模板里的 [[mods]]）────────
        // MDG 把每个条目写成一串 `name%%<目录>` 到 -Dfml.modFolders；FML 的
        // CommonLaunchHandler 按 **name** 分组，UserdevLocator 对**每组**调一次
        // pipeline.addPath(...) ⇒ **一个条目 = 一个 mod 文件**，同一组里的多个
        // sourceSet 被并成同一个文件（P3v §4a 实测）。组名本身不参与任何判定，
        // 它只是分组键（读 UserdevLocator：名字只做 Map 的 key）。
        // 所以两个条目 = dev 里两个本模组 mod 文件，ModDiscoverer 会打印两行。
        // ── P3z：条目数 = dev 里本模组 mod 文件的个数 ──────────────────────────────
        "coe_integration" {
            // P3z：**根工程自己的 mod 文件**（集成层）。
            // CEWS 搬走之后根工程一个本模组 @Mod 都不剩了，而 FML 要求每个 [[mods]] 条目
            // 都有同文件的 @Mod 类（有条目没类 = 静默无入口；有类没条目 = dangling_entrypoint
            // 硬错）。所以根工程现在自己是第四个 mod：modId=coe_integration，
            // 入口 = common/hub/IntegrationMod（集成层 + 根资源 + jarJar 组装都挂在它名下）。
            // 注册命名空间一字未变（仍是 createoreexpansion）。
            sourceSet(sourceSets.main)
            // P3M：core 的 classes/resources 也**作为本 mod 的源**交给 FML（dev 限定）。
            // 效果：`-Dfml.modFolders` 里多出 core 的目录，FML 把它们与根工程输出
            // **合并成同一个 mod 文件**（UserdevLocator 按 mod 名成组 addPath → 一个 SecureJar
            //  多根 union），于是 core 的类由 GAME 层的类加载器定义 → 能看见 MC/NeoForge/Create。
            // 生产不受影响：那里 core 仍是 JarJar 嵌套库，本条只改 dev 的 modFolders。
            sourceSet(project(':core').sourceSets.main)
        }
        "coe" {
            // P3w：:coe 是 **createoreexpansion** 自己的 mod 文件（它的
            // src/main/templates/META-INF/neoforge.mods.toml 声明该 id），所以必须
            // **单开一个条目**——塞进上面那个条目会让两份 mods.toml 落进同一个
            // SecureJar，模棱两可（P3u 实测：多条 sourceSet 进同一组只出一个文件）。
            sourceSet(project(':coe').sourceSets.main)
        }
        "transmutation" {
            // P3y：:transmutation 是 **transmutation** 自己的 mod 文件（它的
            // src/main/templates/META-INF/neoforge.mods.toml 声明该 id），同理必须
            // **单开一个条目**（P3u 实测：多条 sourceSet 进同一组只出一个文件）。
            sourceSet(project(':transmutation').sourceSets.main)
        }
        "cews" {
            // P3z：:cews 是 **cews** 自己的 mod 文件（它的
            // src/main/templates/META-INF/neoforge.mods.toml 声明该 id），同理必须
            // **单开一个条目**。四个条目 = dev 里四个本模组 mod 文件。
            sourceSet(project(':cews').sourceSets.main)
        }
    }
}

// ═══════════════════════════════════════════════════════════════════════════════
// W3：发布形态（published form）运行配置 —— 「三个发布的模块 jar 一起装」的统一测试台
// ═══════════════════════════════════════════════════════════════════════════════
// 目的：把 :coe / :cews / :transmutation 三个**发布 jar** 一起放进 <gameDir>/mods/，一次启动
// 验掉六轮以来唯一没有任何静态关卡覆盖的部分：JPMS 包重叠 / GAME-PLUGIN 分层 /
// 三份同名嵌套 core 的去重 / mixin 是否真注入 / 数据包是否干净加载 / 配置是否真注册 /
// 四个入口是否都被识别。
//
// 为什么不能直接把 jar 丢进 run/mods/（本轮的关键冲突）：
//   dev 的 neoForge.mods{}（本文件上面那段）把根工程 + core + :coe + :cews + :transmutation
//   绑成**四个 dev mod 文件**（-Dfml.modFolders）。FML 4.0.42 的 UserdevLocator 先 claim
//   modFolders 里的每个路径，再对 java.class.path 上每个含 META-INF/neoforge.mods.toml 的根
//   做一次补扫（DevEnvUtils.findFileSystemRootsOfFileOnClasspath），**未被 claim 的也照样当
//   mod 文件**。所以再往 run/mods/ 放一份 jar ⇒ 同一个 mod id 两个文件 ⇒
//   fml.modloadingissue.duplicate_mod 硬崩 —— 假警报，什么也证明不了。
//
// 本配置的机制（每条都有 MDG / FML 源码出处，见 build/patch/w3-EVIDENCE.txt）：
//   ① loadedMods.set([]) —— RunModel#getLoadedMods() 是**每个 run 独立**的 SetProperty
//      （MDG dsl/RunModel.java:153，convention 才是"全工程 mods{}"），MDG 用它生成
//      -Dfml.modFolders（internal/ModDevRunWorkflow.java:432 → RunUtils#getGradleModFoldersProvider）。
//      置空 ⇒ 没有任何目录被 claim。
//   ② sourceSet = 一个**空** source set —— run 的 java.class.path 由
//      run.getSourceSet().runtimeClasspath 决定（ModDevRunWorkflow.java:421）。沿用 main 会让
//      build/resources/main（它含本工程展开后的 META-INF/neoforge.mods.toml）留在 classpath
//      上，被 ① 放出来的补扫重新发现成第二个 coe_integration ⇒ 又是 duplicate_mod。
//      空 source set 的输出目录不存在 ⇒ 补扫在本工程上 0 命中。
//      它**仍然必须**拿到 Minecraft/NeoForge 类：1.21.1 的 versionCapabilities 是
//      modLocatorRework=true + needsNeoForgeInMinecraftJar=true，MC 与 NeoForge 合并躺在
//      neoforge-21.1.228-merged.jar 里、**只经 java.class.path 可见**（legacyClasspath 里
//      只有 game libraries + client-extra），所以用公开 API
//      neoForge.addModdingDependenciesTo(...)（dsl/ModDevExtension.java:156）把
//      modDevRuntimeDependencies 接到本源集上。
//   ③ gameDirectory 放在 build/ 下：.gitignore 的 run/ 是**没有锚定**的裸模式，不覆盖
//      run-published/，那样会留下未跟踪目录；build/ 整体被忽略 ⇒ 天然干净。
//   ④ 本段**不碰**上面任何一条 mod 绑定，也不改 processResources / jar：只多一个空 source set
//      与两个 run 任务。产物条目集与逐条目哈希前后不变（build/patch/w3-jar-hashes-*.txt）。
// 准备脚本（幂等）：tools\prepare-run-published.ps1
sourceSets {
    // 空 source set：唯一用途是给下面两个 run 提供一个「不是 main」的 runtimeClasspath 容器。
    // 故意不登记任何 srcDir / resources ⇒ 它的输出目录都不存在。
    publishedRuntime
}

neoForge {
    // 把 MDG 的 Minecraft/NeoForge 运行时依赖接到本源集（公开 API，见上面 ②）。
    addModdingDependenciesTo(sourceSets.publishedRuntime)

    runs {
        // 发布形态 · 服务端（本轮核心证据）：三个模块 jar 全装 + --nogui
        publishedServer {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory.set(project.file('build/published-run'))
            sourceSet.set(sourceSets.publishedRuntime)
            loadedMods.set([])
            // MDG 生成的 log4j2.xml 用 sys:forge.logging.marker.<name> 控制 marker，
            // 默认 DENY；不打开的话 "Found mod file ..."（LogMarkers.SCAN）不会落进日志，
            // 而那一行正是"加载的是 jar 不是 dev classes"的原始证据。
            systemProperty 'forge.logging.marker.scan', 'ACCEPT'
        }
        // 发布形态 · 客户端：同一条配置的客户端变体（起得来 / 进得了主菜单即算过）。
        publishedClient {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory.set(project.file('build/published-run-client'))
            sourceSet.set(sourceSets.publishedRuntime)
            loadedMods.set([])
            systemProperty 'forge.logging.marker.scan', 'ACCEPT'
        }
    }
}

// ── W3 附：发布形态测试台的类路径补偿（Registrate）────────────────────────────────
// Create 的 **:slim 分类器把 JarJar 嵌套件整个剥掉了**（实测 create-1.21.1-6.0.10-280-slim.jar
// 的 META-INF/jarjar/ 条目 = 0、com/tterrag/registrate/** = 0），所以 dev 里 Create 靠的是
// **类路径上那份独立的 Registrate**（root 的 implementation("com.tterrag.registrate:Registrate")）。
// 正式发布的 Create 件是把 Registrate 放进自己的 META-INF/jarjar/（清单里带
// `FMLModType: GAMELIBRARY`，由 JarInJarDependencyLocator 当 GAME 层库加载）。
// 本机缓存里只有 slim 件（无网 / 本轮不许下载），所以发布形态测试台必须把这一份补回类路径，
// 否则 Create.<clinit> 直接 NoClassDefFoundError: com/tterrag/registrate/AbstractRegistrate。
// 实测（build/patch/w3-runtime-cp-all.txt，122 项）：dev 运行时类路径上"非 mod 且非
// MC/FML 基础设施"、又带 FMLModType 的**只有 Registrate 一个**，所以这里是唯一需要补的。
// 它**不是 mod 文件**（无 META-INF/neoforge.mods.toml），进 mods/ 也不会被当 mod 读；
// 补在类路径上不削弱「本模组的 mod 文件只来自 <gameDir>/mods」这个结论。
dependencies {
    publishedRuntimeRuntimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")
}

// ── W3 附：列出 dev 运行时类路径上的「第三方真 mod jar」 ──────────────────────────
// 发布形态测试台要往 <gameDir>/mods 里补必需的第三方 mod（Create / Flywheel / Ponder /
// JEI / Curios / CC&A / …）。那份清单必须与 dev 实际加载的**同一批** jar，不能手抄
// （手抄必然漂移）。本任务只解析 configurations.runtimeClasspath，挑出带
// META-INF/neoforge.mods.toml 且 modId **不含本模组五个 id** 的 jar，逐行写
// 「绝对路径<TAB>modId 列表」。它**不参与** jar / processResources，对产物零影响。
// 本模组自己那五个 id 必须排除：createoreexpansion / cews / transmutation 由模块发布 jar 提供，
// coe_integration 属于根工程（发布形态里不装），skiller 是 jarJar 嵌套件（不该另有一份平铺 jar，
// 否则 JarSelector 会看到两个路径不同的候选）。
// 注意 configuration cache：动作闭包里**不许**引用脚本对象（configurations / logger / layout …），
// 所以类路径先取成局部 Configuration 再捕获；日志走 task 自己的 logger。
def w3DevRuntimeCp = configurations.runtimeClasspath
tasks.register('w3ThirdPartyModJars') { t ->
    t.group = 'coe'
    t.description = 'W3: list third-party mod jars (META-INF/neoforge.mods.toml present) on the dev runtime classpath'
    def outFile = layout.buildDirectory.file('patch/w3-third-party-mod-jars.txt')
    t.inputs.files(w3DevRuntimeCp)
    t.outputs.file(outFile)
    t.doLast {
        // 本工程自己的五个 id（平铺 jar 一份都不许有：三个由模块发布 jar 提供，
        // coe_integration 属根工程、发布形态不装，skiller 是 jarJar 嵌套件）。
        def ours = ['createoreexpansion', 'cews', 'transmutation', 'coe_integration', 'skiller'] as Set
        // 游戏/加载器本体（neoforge-<v>.jar 等）由 MDG 的 modDevRuntimeDependencies 直接挂在
        // java.class.path 上、FML 自己会发现它 —— 放进 mods/ 只会多一份重复。
        def system = ['neoforge', 'minecraft'] as Set
        def lines = []
        w3DevRuntimeCp.files.each { f ->
            if (!f.name.toLowerCase().endsWith('.jar')) {
                return
            }
            def text = null
            def zf = new java.util.zip.ZipFile(f)
            try {
                def entry = zf.getEntry('META-INF/neoforge.mods.toml')
                if (entry == null) {
                    return
                }
                zf.getInputStream(entry).withStream { is ->
                    text = is.getText('UTF-8')
                }
            } finally {
                zf.close()
            }
            // 只取**第一个 [[mods]] 段**里的 modId —— 后面那些 modId 全是 [[dependencies]] 的
            // 依赖项（把 create 的 flywheel/ponder/sodium… 当成"本 jar 的 mod"就全错了）。
            def m = (text =~ /(?ms)^\[\[mods\]\].*?^\s*modId\s*=\s*"([^"]+)"/)
            if (!m.find()) {
                return
            }
            def primary = m.group(1)
            if (ours.contains(primary) || system.contains(primary)) {
                return
            }
            lines << (f.absolutePath + '\t' + primary)
        }
        def target = outFile.get().asFile
        target.parentFile.mkdirs()
        target.setText(lines.sort().join('\n') + '\n', 'UTF-8')
        t.logger.lifecycle("W3: ${lines.size()} third-party mod jar(s) -> ${target}")
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ── Skiller 技能内核（内置 / JarJar 嵌套）────────────────────────────────────────────
    // 本模组的「工具技能系统」自 2026-09 起改用 Leaf 的 Skiller 内核（MIT）。
    // jarJar(...) 会把 skiller-1.0.0.jar 原样嵌进本模组的 META-INF/jarjar/，
    // 玩家只装本模组一个 jar，NeoForge 会把嵌套 jar 当独立 mod（mod id: skiller）加载。
    // 编译期同时可见（jarJar 继承 implementation），所以 content 层可以直接 import com.leaf.skiller.*。
    // jar 放在 libs-maven/（本地 maven 布局，随仓库提交），不依赖网络。
    jarJar(implementation("com.leaf:skiller:1.0.0"))
    // 开发环境（runClient/runData）需要 Skiller 作为一个真实 mod 在场：
    // MDG 会把 jarJar 依赖一并放进运行时 classpath，无需额外声明。
    //
    // ── core 共享库（P3d：普通库，JarJar 嵌套，**没有 mod id**）──────────────────────
    // core **不是** mod：没有 `META-INF/neoforge.mods.toml`、没有 mod id，这里**不许**出现
    // "coe_core" 这样的第二个 mod 名。
    // （P4e 起它带 `FMLModType: GAMELIBRARY` —— 那是**模块层归属**声明，不是 mod 身份：
    //   它让 core 进 GAME 层而不是 PLUGIN 层，见 core/build.gradle；仍然没有 [[mods]]。）
    // "core 的类也是本 mod 的类" 这件事用**源绑定**表达 —— 见上面 neoForge.mods{} 里
    // 那行 `sourceSet(project(':core').sourceSets.main)`，它只改 dev 的 fml.modFolders。
    // 下面这一行负责另两件事：「编译期可见」与「发布时嵌进 META-INF/jarjar/」。
    // ⚠ **P4e：这里必须用 compileOnly，不能用 implementation**（与上面 :coe / :transmutation / :cews
    // 三条同一个形状、同一类后果，只是症状不同）。
    //   背景：core 的 jar 从 P4e 起带 `FMLModType: GAMELIBRARY`（core/build.gradle）——
    //   生产里这是修 NoClassDefFoundError 的关键，但在 **dev** 里它让 core 的 jar 变成一个
    //   **真正会被 FML 认领的 mod 文件**：`JarModsDotTomlModFileReader` 见到 FMLModType 就直接建
    //   ModFile（以前没有这个属性、又没有 mods.toml，落到 `NestedLibraryModReader` 时因为
    //   `discoveryAttributes.parent() == null` 而被**整个忽略**）。
    //   `implementation` 会把 core 的 jar 放进 `sourceSets.main.runtimeClasspath`，而 FML 的
    //   dev 发现逻辑会扫 classpath 上每个可识别的 mod 文件 ⇒ core 的类同时从**两处**进 GAME 层：
    //     ① core 的 jar（自动模块 `coe.core`）；
    //     ② fml.modFolders 把 core 的 sourceSet 输出并进根 mod 文件（`coe_integration`）。
    //   两个模块导出同一个包 → `ModuleLayerHandler` 直接抛（P4e 实测，`runData` 秒崩）：
    //     java.lang.module.ResolutionException: Modules coe.core and coe_integration
    //     export package com.hjmmd_8.createoreexpansion.common.i18n to module kubejs
    //   compileOnly 让那个 jar 从 runtimeClasspath 上消失 ⇒ dev 里 core 只剩 ② 这一条来源
    //   （与 P4e 之前的行为逐字相同），而「编译期可见 + 发布时嵌进 jar」两件事不受影响
    //   （jarJar 配置照样解析得到 core 的 jar 变体）。
    //   为什么不干脆撤掉 ② 让 core 只当独立模块：core 有 `@EventBusSubscriber`（AllConfig 等），
    //   而 `IntegrationBootstrap` 正是靠**根 mod 文件的 scan data** 找到它们；撤掉合并会让
    //   那一整类事件订阅静默失效（AGENTS.md 红线：注解的作用域是「每个 mod 文件」）。
    // ⚠ dev 运行期的可见性**不是**由依赖声明决定的（P3m 实测改正了 P3d 的错误结论）：
    // 当年那行 jarJar(implementation(...)) 让「编译期可见 + 发布时嵌进 jar」成立，
    // core 的 jar 也**确实**会进 runData 的 java.class.path（P4e 已改成 compileOnly，
    // 那个 jar 现在**不在** classpath 上了 —— 见本块开头）。但**进 java.class.path ≠ 游戏看得见**：
    //   · BSL（BootstrapLauncher）把 legacy classpath 的每个 jar/目录都变成 **BOOT 层**
    //     自动模块，其类加载器（堆栈里的 MC-BOOTSTRAP）**只**以 JDK boot 层为父
    //     （`new ModuleClassLoader("MC-BOOTSTRAP", cfg, List.of(ModuleLayer.boot()), null)`），
    //     MC/NeoForge/Create 都不在其中 ⇒ core 的方法体一碰 MC 就 NoClassDefFoundError。
    //   · java.class.path 上不在 legacy classpath 里的普通库 jar 既不是 mod、又不在 GAME 层的
    //     类加载器链上 ⇒ **完全不可见**（实测：删掉 additionalRuntimeClasspath 后连
    //     ...util.GoggleUtil 本身都 NoClassDefFoundError）。
    //     ⚠ P4e 更正这句的边界：被判成「mod 文件」的不止带 `META-INF/neoforge.mods.toml` 的 jar
    //     —— 带 **`FMLModType`** 的 jar 同样会被 `JarModsDotTomlModFileReader` 认领
    //     （`GAMELIBRARY` → GAME 层、`LIBRARY` → PLUGIN 层）。core 正是因此才必须从
    //     runtimeClasspath 上挪走，否则它变成一个与 `coe_integration` 抢包的真模块。
    //   · 旧的 `additionalRuntimeClasspath project(':core')` 正是把 core 钉进 BOOT 层那一半，
    //     所以它**注定看不见 MC**（jar 与目录形态都试过，目录只是让模块名变成目录名 main）。
    // 正确做法（P3m 落地）＝把 core 的 source set 作为**本 mod 的第二个源**登记进
    // neoForge.mods{}（见上面 mods 块）。MDG 于是把它写进 `-Dfml.modFolders`，
    // FML 的 UserdevLocator 按 mod 名成组 addPath → 根输出与 core 输出**合并成同一个
    // mod 文件**（一个 SecureJar 多根 union），core 的类因此由 **GAME 层**的
    // TransformingClassLoader 定义 ⇒ MC/NeoForge/Create 全部可见。
    // 这一步**只影响 dev**（modFolders 是 dev 启动参数）；生产仍由嵌套 jar 提供，
    // 也仍需要上面那行 jarJar(...)。compileOnly（P4e）只为把那个 jar 挡在 dev 的
    // runtimeClasspath 之外 —— 理由见本块开头那段 ResolutionException 实测。
    jarJar(compileOnly(project(':core')))
    // ── coe 模块（P3w：矿物拓展自己的 mod 文件，源码在 coe/，由根 jar 用 JarJar 嵌套）──
    // ⛔ 这里**必须**是 compileOnly，不能是 implementation：
    //   implementation(project(':coe')) 会把 coe/build/libs/createoreexpansion-1.0.0.jar 放进
    //   `sourceSets.main.runtimeClasspath`（MDG 的 run 任务正是取这个集合，见 p3v-EVIDENCE §4b），
    //   而 FML 的 dev 发现逻辑把 classpath 上每个**带 META-INF/neoforge.mods.toml 且未被
    //   modFolders 认领**的根也当 mod 文件 → :coe 的 jar 与它的 modFolders 目录是两个不同的根
    //   → 同一个 createoreexpansion 出现两次 → UniqueModListBuilder 抛
    //   `fml.modloadingissue.duplicate_mod`（硬崩，不是"选最新"那条温和路径）。
    //   compileOnly + jarJar(compileOnly(...)) 同时保住「编译期可见」与「发布时嵌进
    //   META-INF/jarjar/」，而那个 jar 从 runtimeClasspath 上消失（P3v 探针 E 实测：125 项，无 coe jar）。
    jarJar(compileOnly(project(':coe')))
    // ── transmutation 模块（P3y：机械嬗化学自己的 mod 文件，源码在 transmutation/，由根 jar 用 JarJar 嵌套）──
    // 与上面 :coe 那条**同款、同理由**：必须是 compileOnly（不能是 implementation，那会让
    // transmutation/build/libs/transmutation-1.0.0.jar 进 runtimeClasspath → FML 把它当第二个
    // transmutation mod 文件 → fml.modloadingissue.duplicate_mod 硬崩，P3v §4b 实测的同一形状）；
    // 外层 jarJar(...) 让那个 jar 嵌进本 jar 的 META-INF/jarjar/（深度 1，唯一有效深度）。
    // 同时它也是根工程的**编译面**：根侧 SHARED 文件（common/hub/AllFluids、AllModEffects、
    // AllRecipeTypes、data/CreateOreExpansionDatagen、data/lang/*、compat/jei/CreateOreExpansionJEI）
    // 直接 import TRANS 的类。
    jarJar(compileOnly(project(':transmutation')))
    // ── cews 模块（P3z：能量波阵学自己的 mod 文件，源码在 cews/，由根 jar 用 JarJar 嵌套）──
    // 与上面 :coe / :transmutation 两条**同款、同理由**：必须是 compileOnly（implementation 会让
    // cews/build/libs/cews-1.0.0.jar 进 runtimeClasspath → FML 把它当第二个 cews mod 文件 →
    // fml.modloadingissue.duplicate_mod 硬崩，P3v §4b 实测的同一形状）；外层 jarJar(...) 让那个
    // jar 嵌进本 jar 的 META-INF/jarjar/（深度 1，唯一有效深度）。
    // 同时它也是根工程的**编译面**：根侧 SHARED 文件（common/hub/AllCreativeModeTabs、
    // AllRecipeTypes、data/CreateOreExpansionDatagen、data/RecipeProvider、data/lang/*、
    // compat/jei/{CreateOreExpansionJEI,ChargingJEI}、client/*ModelRegistration）直接
    // import CEWS 的类。
    jarJar(compileOnly(project(':cews')))
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    // compile against the JEI API but do not include it at runtime
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    // at runtime, use the full JEI jar for NeoForge
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    // CC&A (Create Crafts & Additions)：编译期需要其 ChargingRecipe/TeslaCoil 类（Mixin 注入 IAssemblyRecipe），运行期可选
    compileOnly("curse.maven:createaddition-439890:8083378")
    runtimeOnly("curse.maven:createaddition-439890:8083378")
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"
    // Jade（WAILA 类 HUD）—— 完全可选集成：compileOnly 编译期可用，运行期不强制；
    // 代码层用反射隔离（ModList.isLoaded 判断 + Class.forName 加载插件），
    // 未安装 Jade 时绝不加载 Jade 类（吸取"标注 optional 仍硬编码调用导致崩溃"的教训）。
    // 选 1.21.1 老版本 15.8.3 提升兼容性。
    compileOnly("maven.modrinth:jade:15.8.3+neoforge")
    // 本地 dev 测试用（localRuntime 不进发布依赖）：runClient 时把 Jade 放进运行时，
    // 便于直接看到波信息显示效果；发布不捆绑，玩家自装 Jade 才显示。
    localRuntime("maven.modrinth:jade:15.8.3+neoforge")
    // Create Aeronautics（机械动力航空学：飞机/飞艇/直升机物理扩展）+ Sable（其 sub-levels 物理库）——
    // 完全可选集成：compileOnly 编译期可用（后续实现 WaveGateFrame 的动态结构/航空学矩阵接口），
    // localRuntime 让 dev 客户端能直接运行验证；发布不捆绑，玩家自装才生效。
    // 版本配对（2026-06 稳定版，配 Create 6.0.10）：Aeronautics 1.3.0（2026-06-13）要求 Sable 2.0.x，
    // Sable 2.0.3（2026-06-17）为同窗口最后稳定版；1.3.x 起不再依赖 Valkyrien Skies。
    // 注意：Modrinth 的 create-aeronautics 是 bundled 壳 jar（类全在 META-INF/jarjar 嵌套内，编译期不可见），
    // 因此编译期用从 jarjar 提取的 aeronautics-neoforge jar（libs/，含 dev.eriksonn.aeronautics API）；
    // 运行期仍用 bundled jar（内含 Aeronautics+Simulated+Offroad，避免重复加载）。
    compileOnly files("libs/aeronautics-neoforge-1.21.1-1.3.0.jar")
    compileOnly("maven.modrinth:sable:2.0.3+mc1.21.1")
    // Sable 的位姿/包围盒数学类（Pose3d/BoundingBox3d/SubLevelAccess）位于 embedded 的
    // sable-companion jar（Sable 主 jar 的 jarjar 内，编译期不可见）→ 从 jarjar 提取后加入编译期
    compileOnly files("libs/sable-companion-common-1.21.1-1.6.0.jar")
    // Create Optical（机械动力：光学，聚光器 4 光频加工）+ Create: Vintage Improvements（卷簧机/杠杆锤等）——
    // 星辉波变器联动：完全可选集成。compileOnly 编译期可用（本地 jar）；localRuntime 让 dev 客户端
    // （runClient/runData）直接加载这两个 mod 便于验证联动，发布不捆绑——玩家自装才生效。
    // 代码层用 ModList.isLoaded + try/catch 隔离，未安装时绝不加载其类。
    compileOnly files("libs/create_optical-0.4.2.jar")
    compileOnly files("libs/vintageimprovements-1.21.1-0.0.0.3.jar")
    localRuntime files("libs/create_optical-0.4.2.jar")
    localRuntime files("libs/vintageimprovements-1.21.1-0.0.0.3.jar")
    localRuntime("maven.modrinth:create-aeronautics:1.3.0+mc1.21.1")
    localRuntime("maven.modrinth:sable:2.0.3+mc1.21.1")
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

//    runtimeOnly("curse.maven:vintage-improvenents-ssw-edition-1255448-8381973")
}

// 数据生成（runData）不需要 Sable/Aeronautics：物理结构库对 datagen 无贡献，
// 且其 mixin 与 Registrate 的并发数据生成偶发冲突（TagsProvider ConcurrentModificationException）
// → 从 runData 的 classpath 排除，保证 datagen 稳定可复现。
tasks.named('runData').configure {
    classpath = classpath.filter {
        !it.name.contains('sable') && !it.name.contains('aeronautics')
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
