# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml
# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader = "javafml" #mandatory
# A version range to match for said mod loader - for regular FML @Mod it will be the the FML version. This is currently 47.
loaderVersion = "${loader_version_range}" #mandatory
# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license = "${mod_license}"
# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

# ── P3w：根 jar 里装两个 mod + 两个 JarJar 嵌套的东西 ────────────────────────────────────
# **本文件（根工程）只声明 cews / transmutation 两个 mod。**
# 第三个 mod —— **createoreexpansion（矿物拓展 COE）—— 不在本文件里**：P3w 起它的代码
# （176 个 COE 文件）与 [[mods]] 声明都搬进了 Gradle 子模块 :coe，见
# coe/src/main/templates/META-INF/neoforge.mods.toml，由根 build.gradle 的
# jarJar(compileOnly(project(':coe'))) 嵌进 META-INF/jarjar/。
# ⛔ **同一个 mod id 绝不能出现在两个 mod 文件里**：UniqueModListBuilder 会判
#    fml.modloadingissue.duplicate_mod 直接硬崩（不是"选最新"那条温和路径）。
# 两个 JarJar 嵌套：
#   · core（共享库，**不是** mod：coe_library=true，没有也不该有 mods.toml）；
#   · coe（**是** mod：自带 mods.toml 并声明 createoreexpansion）。
# 另有技能内核 skiller（**是** mod，mod id = skiller）同样由 JarJar 嵌套，声明在下面。
#
# 四个模块的**注册命名空间全部是 createoreexpansion**（见 common/CoeCore#REGISTRY_NAMESPACE），
# 所以拆模块不会改动任何一个注册 id、语言键、配置键或数据包路径；mod id 才分家。

# ============================ 1/2：cews（能量波阵学） ============================
[[mods]] #mandatory
modId = "cews"
version = "${mod_version}" #mandatory
displayName = "Create: Energy Wave Studies"
authors = "${mod_authors}" #optional
description = '''${mod_description}'''

# ============================ 2/2：transmutation（机械嬗化学） ============================
[[mods]] #mandatory
modId = "transmutation"
version = "${mod_version}" #mandatory
displayName = "Create: Mechanical Transmutation"
authors = "${mod_authors}" #optional
description = '''${mod_description}'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
# 只声明一次（TOML 里 [[mixins]] 是**顶层**表数组，没有"挂在某个 mod 下面"这回事）：
# 混入目标横跨各层（例如 client/、content/、mixin/），所以整个 jar 只登记这一份配置，
# 由 createoreexpansion 这个模块"代表"声明。
# （core 不做 mod，所以它将来带的 mixin 插件要另行处理：库没有 mod 文件，
#   不能靠 [[mixins]] 声明，得由拥有它的那个 mod 的配置带进去。）
[[mixins]]
config = "${mod_id}.mixins.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

# ── 依赖 ────────────────────────────────────────────────────────────────────────────────
# 两个 mod 的基础依赖与拆分前完全一致（没有把任何 required 降级）；
# 模块之间的依赖按既有规格：cews → createoreexpansion 为 optional，transmutation → createoreexpansion 为 required。
# （createoreexpansion 自己的 [[dependencies]] 段落随它的 [[mods]] 一起搬到了 :coe 的模板，
#   段落内容与该模板**逐字对齐**；coe_core 的依赖块早在 P3d 就删了：core 不是 mod。）
#
# ⚠ 跨文件的依赖是允许的：createoreexpansion 由 :coe 那个嵌套 mod 文件声明，
#   这里的 ordering = AFTER/BEFORE 照样生效（FML 的依赖图按 mod id 建，不按文件）。

# createoreexpansion（COE）的依赖段落**不在这里** —— 它随 [[mods]] 一起搬到了
# coe/src/main/templates/META-INF/neoforge.mods.toml，内容与本文件原先那段逐字对齐
# （neoforge / minecraft / create required，jei / curios optional，createaddition required）。

# cews：基础环境依赖 + 对 COE **optional**（材料来自矿物拓展；未装 COE 时本模块自身仍可加载）
[[dependencies."cews"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."cews"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."cews"]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.1.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies."cews"]]
modId = "jei"
type = "optional"
versionRange = "[19.27.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."cews"]]
modId = "curios"
type = "optional"
versionRange = "[9.5.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."cews"]]
modId = "createaddition"
type = "required"
versionRange = "[1.5.11,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."cews"]]
modId = "createoreexpansion"
# 模块依赖：CEWS 单向依赖 COE（材料），但**不是硬依赖** —— 用 optional，
# 并让 COE 缺席时相关联动降级（AGENTS.md「CEWS 单向依赖 COE」口径）。
type = "optional"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"

# transmutation：基础环境依赖 + 对 COE **required**（第 4 层强依赖第 2 层的互锁，见四模块方案 §13）
[[dependencies."transmutation"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."transmutation"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."transmutation"]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.1.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies."transmutation"]]
modId = "jei"
type = "optional"
versionRange = "[19.27.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."transmutation"]]
modId = "curios"
type = "optional"
versionRange = "[9.5.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."transmutation"]]
modId = "createaddition"
type = "required"
versionRange = "[1.5.11,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."transmutation"]]
modId = "createoreexpansion"
type = "required"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features."${mod_id}"]
#openGLVersion="[3.2,)"
