# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml
# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader = "javafml" #mandatory
# A version range to match for said mod loader - for regular FML @Mod it will be the the FML version. This is currently 47.
loaderVersion = "${loader_version_range}" #mandatory
# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license = "${mod_license}"
# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

# ── P3d：同一个 jar 里装三个 mod + 一个 JarJar 嵌套的库 ──────────────────────────────────
# 三个 mod 同处 createoreexpansion-1.0.0.jar：
#   createoreexpansion（矿物拓展 COE）/ cews（能量波阵学）/ transmutation（机械嬗化学）。
# 它们的**注册命名空间全部是 createoreexpansion**（见 common/CoeCore#REGISTRY_NAMESPACE），
# 所以拆模块不会改动任何一个注册 id、语言键、配置键或数据包路径。
#
# 第四个模块 core **不在这里**：P3d 起它是「普通库」而不是 mod
# （coe_library=true，见 core/gradle.properties 与 buildSrc/coe-conventions）。
# 它没有自己的 [[mods]]、没有 neoforge.mods.toml，由根 build.gradle 的
# jarJar(implementation(project(':core'))) 原样嵌进 META-INF/jarjar/，
# 运行期作为 unnamed module 上的普通 classpath 条目加载（不参与 JPMS 模块解析，
# 所以它的包可以与 createoreexpansion 重叠 —— 这正是 core 不做 mod 的原因）。
# 同样由 JarJar 嵌套的还有 skiller（技能内核，**是**一个真 mod，mod id = skiller）。

# ============================ 1/3：createoreexpansion（矿物拓展 COE） ============================
# mod id 保持原样不变；原来那个唯一的 [[mods]] 块就是它。
[[mods]] #mandatory
modId = "createoreexpansion"
version = "${mod_version}" #mandatory
displayName = "Create Ore Expansion"
authors = "${mod_authors}" #optional
description = '''${mod_description}'''

# ============================ 2/3：cews（能量波阵学） ============================
[[mods]] #mandatory
modId = "cews"
version = "${mod_version}" #mandatory
displayName = "Create: Energy Wave Studies"
authors = "${mod_authors}" #optional
description = '''${mod_description}'''

# ============================ 3/3：transmutation（机械嬗化学） ============================
[[mods]] #mandatory
modId = "transmutation"
version = "${mod_version}" #mandatory
displayName = "Create: Mechanical Transmutation"
authors = "${mod_authors}" #optional
description = '''${mod_description}'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
# 只声明一次（TOML 里 [[mixins]] 是**顶层**表数组，没有"挂在某个 mod 下面"这回事）：
# 混入目标横跨各层（例如 client/、content/、mixin/），所以整个 jar 只登记这一份配置，
# 由 createoreexpansion 这个模块"代表"声明。
# （core 不做 mod，所以它将来带的 mixin 插件要另行处理：库没有 mod 文件，
#   不能靠 [[mixins]] 声明，得由拥有它的那个 mod 的配置带进去。）
[[mixins]]
config = "${mod_id}.mixins.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

# ── 依赖 ────────────────────────────────────────────────────────────────────────────────
# 三个 mod 的基础依赖与拆分前完全一致（没有把任何 required 降级）；
# 模块之间的依赖按既有规格：cews → createoreexpansion 为 optional，transmutation → createoreexpansion 为 required。
# （原来的 coe_core 依赖块随 P3d 一并删除：core 已经不是 mod，它作为 JarJar 嵌套库随根 jar 一起分发，
#   不存在"模块依赖"这回事，也不该在 mod 图上出现。）

# createoreexpansion（COE）：基础环境依赖，**无模块依赖**
[[dependencies."createoreexpansion"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."createoreexpansion"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."createoreexpansion"]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.1.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies."createoreexpansion"]]
modId = "jei"
type = "optional"
versionRange = "[19.27.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."createoreexpansion"]]
modId = "curios"
# Curios 为可选联动：装了 Curios → 凝能佩走饰品支线（饰品槽装备/效果/渲染与旧版一致）；
# 没装 → 凝能佩按纯物品注册（可合成/可持有，只是没有饰品槽效果），绝不因缺类而崩溃。
type = "optional"
versionRange = "[9.5.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."createoreexpansion"]]
modId = "createaddition"
type = "required"
versionRange = "[1.5.11,)"
ordering = "NONE"
side = "BOTH"

# cews：基础环境依赖 + 对 COE **optional**（材料来自矿物拓展；未装 COE 时本模块自身仍可加载）
[[dependencies."cews"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."cews"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."cews"]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.1.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies."cews"]]
modId = "jei"
type = "optional"
versionRange = "[19.27.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."cews"]]
modId = "curios"
type = "optional"
versionRange = "[9.5.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."cews"]]
modId = "createaddition"
type = "required"
versionRange = "[1.5.11,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."cews"]]
modId = "createoreexpansion"
# 模块依赖：CEWS 单向依赖 COE（材料），但**不是硬依赖** —— 用 optional，
# 并让 COE 缺席时相关联动降级（AGENTS.md「CEWS 单向依赖 COE」口径）。
type = "optional"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"

# transmutation：基础环境依赖 + 对 COE **required**（第 4 层强依赖第 2 层的互锁，见四模块方案 §13）
[[dependencies."transmutation"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."transmutation"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."transmutation"]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.1.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies."transmutation"]]
modId = "jei"
type = "optional"
versionRange = "[19.27.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."transmutation"]]
modId = "curios"
type = "optional"
versionRange = "[9.5.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."transmutation"]]
modId = "createaddition"
type = "required"
versionRange = "[1.5.11,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."transmutation"]]
modId = "createoreexpansion"
type = "required"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features."${mod_id}"]
#openGLVersion="[3.2,)"
