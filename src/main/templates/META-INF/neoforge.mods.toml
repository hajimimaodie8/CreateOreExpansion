# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml
# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader = "javafml" #mandatory
# A version range to match for said mod loader - for regular FML @Mod it will be the the FML version. This is currently 47.
loaderVersion = "${loader_version_range}" #mandatory
# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license = "${mod_license}"
# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

# ── P3z：根 jar 里装四个 mod（一个根工程自己的 + 三个 JarJar 嵌套的）────────────────────
# **本文件（根工程）只声明 coe_integration 一个 mod —— 即根工程自己的集成层。**
# 三个内容 mod 的代码与 [[mods]] 声明**都不在本文件里**：
#   · **createoreexpansion（矿物拓展 COE）**：P3w 起搬进 Gradle 子模块 :coe，
#     见 coe/src/main/templates/META-INF/neoforge.mods.toml，
#     由根 build.gradle 的 jarJar(compileOnly(project(':coe'))) 嵌进 META-INF/jarjar/。
#   · **transmutation（机械嬗化学 TRANS）**：P3y 起搬进 Gradle 子模块 :transmutation，
#     见 transmutation/src/main/templates/META-INF/neoforge.mods.toml，同上方式嵌套。
#   · **cews（能量波阵学 CEWS）**：P3z 起搬进 Gradle 子模块 :cews，
#     见 cews/src/main/templates/META-INF/neoforge.mods.toml，同上方式嵌套。
# ⛔ **同一个 mod id 绝不能出现在两个 mod 文件里**：UniqueModListBuilder 会判
#    fml.modloadingissue.duplicate_mod 直接硬崩（不是"选最新"那条温和路径）。
#
# **为什么根工程现在自己是一个 mod（coe_integration）**：CEWS 搬走之后，根工程里
# 一个本模组的 @Mod 类都不剩了，而 FML 要求每个 [[mods]] 条目都有同文件的 @Mod 类
# （有条目没类 = 静默无入口；有类没条目 = dangling_entrypoint 硬错）。反过来说，
# 让本文件的 [[mods]] 变成空数组也不行：没有 mod 就没有 ModContainer，
# AutomaticEventSubscriber 的注入对本文件整体不发生 ⇒ 根侧的 datagen 入口、
# Ctrl+扳手、配置重载、JEI 插件、hub 补挂全部静默失效。所以根工程给自己一个 mod id：
# 入口 = common/hub/IntegrationMod，名下装着集成层（common/hub/**、common/hub 的聚合入口、
# data/**、compat/**、mixin 声明、以及发布时的 JarJar 组装）。
# 它**不是**内容 mod：注册命名空间一字未变（仍是 createoreexpansion），
# 也不注册任何本模组的游戏内容。
#
# 四个 JarJar 嵌套（都在本 jar 的 META-INF/jarjar/ 第 1 层）：
#   · core（共享库，**不是** mod：coe_library=true，没有也不该有 mods.toml）；
#   · coe（**是** mod：自带 mods.toml 并声明 createoreexpansion）；
#   · transmutation（**是** mod：自带 mods.toml 并声明 transmutation）；
#   · cews（**是** mod：自带 mods.toml 并声明 cews）。
# 另有技能内核 skiller（**是** mod，mod id = skiller）同样由 JarJar 嵌套，声明在下面。
#
# 四个模块的**注册命名空间全部是 createoreexpansion**（见 common/CoeCore#REGISTRY_NAMESPACE），
# 所以拆模块不会改动任何一个注册 id、语言键、配置键或数据包路径；mod id 才分家。

# ==================== 1/1：coe_integration（集成层 / 根工程自己的入口） ====================
# 逐字对齐 IntegrationMod.MOD_ID（common/hub/IntegrationMod.java）—— 两处必须一致，
# 改一处就要改两处（与各层 gradle.properties 的 mod_id 同款纪律）。
[[mods]] #mandatory
modId = "coe_integration"
version = "${mod_version}" #mandatory
displayName = "Create Ore Expansion: Integration"
authors = "${mod_authors}" #optional
description = '''${mod_description}'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
# 只声明一次（TOML 里 [[mixins]] 是**顶层**表数组，没有"挂在某个 mod 下面"这回事）：
# 混入目标横跨各层（例如 client/、content/、mixin/），所以整个 jar 只登记这一份配置。
# 它的 config 名走 ${mod_id}（= createoreexpansion，**注册命名空间/资源前缀，不是 mod id**），
# 而这份配置文件的**资源**住在根工程（src/main/resources/createoreexpansion.mixins.json），
# P3z 起由根文件唯一的 mod coe_integration 声明（P3w 起就与 createoreexpansion 这个 mod
# 文件无关了，P3y 曾短暂挂在 cews 名下，P3z 随 id 一起改名）。
# 混入类本身可以住在别的 mod 文件里（:coe 的两个 accessor 就是）：Mixin 服务在 ModLauncher 下
# boot 进 GAME 层的联合类加载器，按包在层内各模块间委派。
# （core 不做 mod，所以它将来带的 mixin 插件要另行处理：库没有 mod 文件，
#   不能靠 [[mixins]] 声明，得由拥有它的那个 mod 的配置带进去。）
[[mixins]]
config = "${mod_id}.mixins.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

# ── 依赖 ────────────────────────────────────────────────────────────────────────────────
# **coe_integration 不声明任何 [[dependencies]] 表**（本文件下面不再有任何
# [[dependencies."…"]]）。理由：根文件的 mod 是**组装/集成载体**，不是内容 mod ——
# 它名下没有一条本模组自己的硬性环境要求（MC / NeoForge / Create 由三个嵌套 mod 各自声明
# required，必然在场），再声明一遍只是重复。
# 时序上也不需要 ordering：IntegrationBootstrap 走 FMLConstructModEvent（所有 ModContainer
# 在构造开始前就已建好），hub 的 DeferredRegister 挂载只要早于 RegisterEvent 即可。
#
# 三个内容 mod 的依赖段落**都不在这里** —— 它们随各自的 [[mods]] 搬到了自己的模板：
#   · coe/src/main/templates/META-INF/neoforge.mods.toml（P3w，逐字对齐）
#   · transmutation/src/main/templates/META-INF/neoforge.mods.toml（P3y，逐字对齐）
#   · cews/src/main/templates/META-INF/neoforge.mods.toml（P3z，逐字对齐：
#     同样的 7 条依赖、同样的 versionRange 与 ordering；cews → createoreexpansion 仍是
#     optional + AFTER，createaddition 仍是 required）
# ⚠ 跨文件的依赖是允许的：createoreexpansion / transmutation / cews 分别由它们的嵌套
#   mod 文件声明，ordering = AFTER/BEFORE 照样生效（FML 的依赖图按 mod id 建，不按文件）。

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features."${mod_id}"]
#openGLVersion="[3.2,)"
