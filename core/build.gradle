// ── core：共享库模块（P3d-β：已从 mod 改成普通库）─────────────────────────────
// 身份变了：core **不是** mod，是一份被 JarJar 嵌进根 jar 的普通库
// （core/gradle.properties 里的 coe_library=true 是唯一开关，见 buildSrc/coe-conventions）：
//   · 没有 src/main/templates/META-INF/neoforge.mods.toml（库没有 mod 元数据）
//   · 不在 neoForge.mods{} 里登记 mod（dev 运行期不再出现 coe_core）
//   · 仍然应用 MDG，仍然拿 Minecraft / NeoForge / Create 的编译 classpath
//
// 为什么必须这样：core 当 mod 时，NeoForge 1.21.1 的 ModLauncher 把每个 mod 文件当成一个
// JPMS 命名模块，同一个 Java 包不允许同时属于两个 mod 文件 —— 实测直接崩在
//   java.lang.module.ResolutionException: Modules coe_core and createoreexpansion
//   export package com.hjmmd_8.createoreexpansion.common.machine to module rhino
// 普通库 jar 进的是 unnamed module、不参与模块解析，于是包可以重叠、
// 搬迁粒度从「包」放宽回「类」（同一个类仍只能存在于一处，否则会出现两个 Class 对象）。
plugins {
    // 版本由根 build.gradle 的 plugins { id 'net.neoforged.moddev' version '2.0.141' } 提供，
    // 子模块这里**不能**再写 version（会报 plugin already on the classpath）。
    id 'net.neoforged.moddev'
    id 'coe-conventions'
}

dependencies {
    // 库模式不注册 mod，但共享层将来要放的是「与 Create 打交道的契约」
    // （机器交互 / 应力口径 / 配方登记表…），所以这里保留 Create 的编译期依赖：
    // 与根 build.gradle 同一坐标、同一写法（:slim + transitive=false），
    // compileOnly ⇒ 不进 core 的发布元数据、也不会在运行期重复提供 Create。
    // 这一行是保留的通用编译面：core 里的共享契约要直接引用 Create 的类型。
    // （W6-d 之前这里举的例子是 ChargingRecipeTools —— 它已按方案 §2.4 的 P2 搬进 :coe，
    //  所以那一句删掉：core 现在没有任何"充能配方工具"概念。）
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    // P3f：整包搬进 core 的 compat/sable/** 直接引用 Sable 的类型（Pose3d/Pose3dc、SubLevel、
    // ServerSubLevel、LevelPlot、ServerSubLevelContainer…），所以 core 自己也需要 Sable 的编译面。
    // 与根 build.gradle 同一坐标、同一写法（Sable 的位姿/包围盒数学类位于 embedded 的
    // sable-companion jar，编译期不可见 → 从 jarjar 提取后作为本地 file 依赖；路径相对**根工程**）。
    // 两行都是 compileOnly：不进 core 的发布元数据，也不改变运行期由玩家自装 Sable 的事实。
    compileOnly files(rootProject.file('libs/sable-companion-common-1.21.1-1.6.0.jar'))
    compileOnly("maven.modrinth:sable:2.0.3+mc1.21.1")
    // P3n：common 顶层整包（10 个文件）搬进 core 后，core 的编译面必须补齐它们用到的三个
    // 外部 API：Registrate 的构建器类型、Flywheel 的 PartialModel、Ponder（catnip）的 Lang。
    // 坐标与根 build.gradle 逐字同源（同样的 ${...} 属性，根 gradle.properties 对本工程全局可见）；
    // 一律 compileOnly —— 运行期由根工程的 implementation/runtimeOnly 提供，
    // core 的发布元数据与嵌套 jar 内容都不因此改变。三行即为全部所需，别再多写。
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    // P3s：JEI 的通用基类（compat/jei/base/CreateRecipeCategory + ProcessingViaFanCategory +
    // JeiRecipeLookup）搬进 core，它们直接引用 mezz.jei 的 IRecipeCategory / IDrawable 等 API。
    // 坐标与根 build.gradle 逐字同源（compileOnly + 运行期由根工程的 runtimeOnly 提供），
    // 因此 core 的发布元数据、嵌套 jar 内容与玩家运行期所需的 JEI 版本都不受影响。
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
}

// ── P4e：core 的 jar 必须声明 FMLModType: GAMELIBRARY ─────────────────────────────────
//
// 症状（上一轮真发布 jar 实测）：不加这一行时 core 的 MANIFEST 只有 `Manifest-Version: 1.0`，
// 于是 core 的类在**生产里一个都不可用**，而且是「静默」的 —— 编译期、runData、分层断言全绿，
// 只有玩家调用到碰 MC 的 core 方法时才抛 NoClassDefFoundError（例如某个 core 类的字段初始化器
// 里写着 net.minecraft.* 类型）。
//
// 根因（FML 4.0.42 源码，逐条读过，不是猜的）：
//   · `JarModsDotTomlModFileReader#createModFile` 先读 manifest 主属性 `ModFile.TYPE`
//     （`new Attributes.Name("FMLModType")`，见 ModFile.java:62）：
//       有 META-INF/neoforge.mods.toml → 按 mods.toml 建 ModFile（类型 MOD）；
//       无 mods.toml 但**有** FMLModType → 按 `manifestParser` + 该类型建 ModFile；
//       两者都没有 → 返回 null，落到 `NestedLibraryModReader`（LOWEST 优先级），
//       而它**硬编码** `IModFile.Type.LIBRARY`（NestedLibraryModReader.java:30）。
//   · `ModValidator` 按类型分层（ModValidator.java:37-39、65-75）：
//       LIBRARY     → `getPluginResources()` → `Layer.PLUGIN`
//       MOD/GAMELIBRARY → `getModResources()` → `Layer.GAME`
//   · ModLauncher 的层级父关系（javap IModuleLayerManager$Layer 的静态初始化实测）：
//       BOOT=[]  SERVICE=[BOOT]  PLUGIN=[BOOT]  GAME=[PLUGIN, SERVICE]
//     于是 **PLUGIN 层看不见 GAME 层** ⇒ LIBRARY 的 core 看不见 MC / NeoForge / Create。
//   · core 是 57 个文件的重度 MC 依赖库 ⇒ 判成 LIBRARY 等于整份 core 失效。
//
// NeoForge 自己的对照（本机 gradle 缓存里的真 jar，用 MANIFEST 实测）：
//   碰 MC 的 `mixinextras-neoforge-0.5.3.jar`  → `FMLModType: GAMELIBRARY`
//   纯库的 `coremods-7.0.3.jar`              → 无 FMLModType（= 默认 LIBRARY）
// 本行照抄前者。
//
// ⚠ 这一行有**前置条件**：core 升到 GAME 层后与根工程同处一个 Configuration，JPMS 不允许
//   同一个包属于两个模块 ⇒ 只要 core 与别的源码根共用任何一个包，启动期就会
//   `java.lang.module.ResolutionException`（从「静默 NoClassDefFoundError」变成「开不起来」）。
//   P4e 已把 core 的 data/lang/Translatable.java 挪进 core 独占的 common/i18n。
//   改动包结构后必须重跑：`tools/check-package-overlap.ps1`（五根包重叠必须为 0）。
jar {
    manifest {
        attributes 'FMLModType': 'GAMELIBRARY'
    }
}
