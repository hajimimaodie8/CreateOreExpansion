# ── core 模块元数据（P3d：已从 mod 改成普通库）────────────────────────────────
# 照 Create Aeronautics / Simulated-Project 的写法：每个模块自己的 gradle.properties。
# 这些键由 buildSrc 的 coe-conventions 插件读取（显式读本文件，不与根 gradle.properties 抢优先级）。
#
# coe_library=true → 库模式（coe-conventions 的唯一开关）：
#   · 不注册 mod（跳过 neoForge.mods{}，dev 运行期不再出现 coe_core 这个 mod）
#   · 不展开 mods.toml（跳过 generateModMetadata 与 sourceSets.main.resources.srcDir）
#   · 不登记 ideSyncTask
# 这一步是 P3d 的破局点：core 当 mod 时，同一个 Java 包不能同时属于两个 mod 文件
# （JPMS ResolutionException: Modules coe_core and createoreexpansion export package ...），
# 于是搬迁粒度被迫是「包」；改成普通库后它进 unnamed module、不参与 JPMS 解析，
# 搬迁粒度放宽回「类」（同一个类仍只能存在于一处）。
# 库模式只跳过上面三件事，仓库 / toolchain / group / version / 归档名一律照旧。
coe_library=true

# 归档名用（库模式不再当 mod id 用，但仍是本模块 jar 的名字：coe_core-1.0.0.jar）。
mod_id=coe_core
mod_name=Create Ore Expansion Core
mod_version=1.0.0
mod_license=All Rights Reserved
mod_authors=hjmmd_8, Leaf
group=com.hjmmd_8.createoreexpansion
description=Shared library module of Create Ore Expansion (not a mod, bundled via JarJar).
