# ${mod_name} — NeoForge 模块元数据模板
#
# 本模块 = **createoreexpansion（矿物拓展 COE）自己的 mod 文件**（P3w 起）。
# 由 buildSrc 的 coe-conventions 插件在 processResources 时展开 TOML 占位符：
#   模板：<module>/src/main/templates/META-INF/neoforge.mods.toml
#   展开：<module>/build/generated/sources/modMetadata/META-INF/neoforge.mods.toml
# mod_id 必须继续是 createoreexpansion（注册命名空间与全部注册 id 一个都不许变）。
#
# 根工程的模板（src/main/templates/...）**只声明 cews / transmutation**，不再声明本 id；
# 同一个 mod id 出现在两个 mod 文件里会被 UniqueModListBuilder 判 duplicate_mod 硬崩。
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

# ============================ createoreexpansion（矿物拓展 COE） ============================
# 本段与根模板原先那段**逐字对齐**：同样的 modId / version / displayName / authors /
# description 字段顺序，以及同样的 [[dependencies]] 集合（含 createaddition **required**）。
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# ── [[mixins]]：配置**跟着类走**（P7b）────────────────────────────────────────────────
# P7b 起本模块声明自己的 mixin 配置。依据（全部读 FML / Mixin 源码实测）：
#   · FML 按**每个 mod 文件自己的 [[mixins]]** 登记配置：
#     LoadingModList.addMixinConfigs() 遍历 modFiles，对每个文件读 file.getMixinConfigs()
#     （= ModFileParser.getMixinConfigs，读的就是那个文件自己的 [[mixins]] 表），
#     再 DeferredMixinConfigRegistration.addMixinConfig(config, modId)。
#   · config 名是**类路径资源名**，不是"相对 mod 文件的路径"：
#     MixinConfig.create(configFile, ...) 只做 service.getResourceAsStream(configFile)，
#     而 MixinServiceModLauncher.getResourceAsStream 是
#     Thread.currentThread().getContextClassLoader().getResourceAsStream(name) ——
#     ModLauncher 下 boot 进 cpw.mods.cl.ModuleClassLoader（GAME 层联合加载器）。
#     对比：accessTransformers / enumExtensions 走的是 file.findResource(...)（相对 mod 文件）。
#   ⇒ 所以【单装本 jar（顶层的 mod 文件）】与【被根 jar 嵌进 META-INF/jarjar/（第 1 层）】
#     两种形态都能取到这个资源，本模块的 src/main/resources/ 就是资源根。
# 本模块里现有 7 个 mixin 类 + 1 个配置插件（全部在 com/hjmmd_8/createoreexpansion/mixin/）：
#   4 个 common mixin（ChargingRecipeAssembly / PoiTypes / ServerPlayerGameMode /
#   TemplateStructurePiece）+ 3 个 client（renderers.coe 两个 accessor + renderers.Minecraft）
#   + plugin = ...mixin.COEMixinConfigPlugin。**没有**第二个层的 mixin 类，
#   所以本模块只有这一份配置（不需要按层再拆）。
# ⚠ 声明的 config 名必须与 jar 里的资源名**逐字一致**：MixinConfig.create 读不到就抛
#   IllegalArgumentException("The specified resource ... was invalid or could not be read")。
[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Create 是四个模块共同的底座（版本区间沿用根工程那份的写法）
[[dependencies."${mod_id}"]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.1.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "jei"
type = "optional"
versionRange = "[19.27.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "curios"
# Curios 为可选联动：装了 Curios → 凝能佩走饰品支线（饰品槽装备/效果/渲染与旧版一致）；
# 没装 → 凝能佩按纯物品注册（可合成/可持有，只是没有饰品槽效果），绝不因缺类而崩溃。
type = "optional"
versionRange = "[9.5.1,)"
ordering = "NONE"
side = "BOTH"

# ── CC&A（Create Crafts & Additions）：**required**（W6-c 复核确认，声明本身未改）───
# 这是依赖矩阵里"第一层对 CA 是 required"的那一条（与 cews / transmutation 两份模板里
# 同样的 required 声明共同构成"谁在场都不能少"的门）。W6-c 把充能器与波引擎搬进本层之后
# 这条依赖的依据更强：波充能链（特斯拉线圈充能 / 变器加工机目录）与雷击线都在本层。
# FML 的 required 判定是**全局**的（ModSorter 把所有 mod 文件的依赖收进同一张图），
# 所以只装 coe.jar 时这条照样生效。
[[dependencies."${mod_id}"]]
modId = "createaddition"
type = "required"
versionRange = "[1.5.11,)"
ordering = "NONE"
side = "BOTH"

# ── 技能内核 Skiller（P4e 新增）：**required** ────────────────────────────────────────
# 为什么是 required 而不是 optional：本模块有 31 个文件直接 import com.leaf.skiller.*
# （实测计数；技能条目 / 策略 / 客户端设置界面），缺了它不是"少一个联动"而是整条技能线
# NoClassDefFoundError —— optional 会让玩家在**加载成功后**才随机崩，比拒绝加载更糟。
# skiller 由本模块自己的 META-INF/jarjar/ 提供
#（coe/build.gradle 的 jarJar(implementation("com.leaf:skiller:1.0.0"))），
# 单独装本模块时它是第 1 层、必然在场；被根 jar 嵌进第 2 层时由根 jar 第 1 层那份满足
#（FML 的依赖图按 mod id 建，不按文件，跨文件声明照样生效）。
# ordering = AFTER：本模块的技能条目要往 Skiller 自己的注册表里登记，
# 让 skiller 先构造完更稳；skiller 不反向依赖本模块，没有环。
# modId / versionRange 与 libs-maven 里那颗 jar 自己的 META-INF/neoforge.mods.toml
# （modId = "skiller" / version = "1.0.0"）逐字对齐。
[[dependencies."${mod_id}"]]
modId = "skiller"
type = "required"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"
