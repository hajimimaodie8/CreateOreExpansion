// ── coe：矿物扩展（P3a 骨架 → P3w 落地）────────────────────────────────────────
// mod id 继续是 createoreexpansion（注册命名空间与注册 id 一个都不许变）。
// P3w 起 176 个 COE 文件 + @Mod 入口 CreateOreExpansion 都住在本模块，本模块自己的
// src/main/templates/META-INF/neoforge.mods.toml 声明 createoreexpansion；
// 根工程的模板**不再**声明它 —— 两个 mod 文件同声明一个 id 会被
// UniqueModListBuilder 判 duplicate_mod 硬崩（P3v §4b 实测）。
plugins {
    id 'net.neoforged.moddev' // 版本由根 build.gradle 的 plugins 块提供
    id 'coe-conventions'
}

// ── 依赖 ───────────────────────────────────────────────────────────────────────
// 仓库列表由 coe-conventions 注册（与根 build.gradle 逐条一致），此处不重复。
//
// ① core 共享库：**jarJar(implementation(project(':core')))**（P4d：本模块 jar 要能单独拿出去跑）。
//    · ⚠ **P4e 更正**：P4d 在这里（以及 p3v §4c）写的理由是**错的** ——
//      「FML 的 dependency locator 只扫一遍、深度 2 的 jar 永不生效」不成立。
//      FML 4.0.42 的 `JarSelector.detect` → `recursivelyDetectContainedJars` 是**递归**的
//      （JarJarSelector-0.4.1 源码里那个 while 循环会继续读每一层新解出的 jar 自己的
//      META-INF/jarjar/metadata.json），深度 2、3 的副本一样会被发现。
//      真正的去重机制是**标识三元组**：`ContainedJarMetadata` 的 equals/hashCode =
//      (identifier, version, path, isObfuscated)，而内层副本的 path 字符串与第 1 层**逐字相同**
//      （都是 "META-INF/jarjar/com.hjmmd_8.createoreexpansion.coe_core-1.0.0.jar"）⇒
//      在 `detectedJarsBySource.keySet()` 里塌成**一个**，`select()` 只产出一份。
//      实测：根 jar 第 1 层那份与本模块内层那份 SHA256 逐字节相同（02960DAF…）。
//    · **结论不变**，但正确的理由是「**每个 jar 的编译面必须自足**」：根侧 30 个文件直接
//      import core，让根只能从 :coe 的内层借 core，等于「:coe 不在场根就崩」；本模块单独
//      发布时同理。所以两边各嵌一份 core（各在自己 jar 的第 1 层）。
//      代价：根 jar 里多一份内层副本（core 约 118 KB）——生产里与第 1 层那份塌成同一份，
//      不会变成第二个 mod 文件。
//    · dev：core 的 classes/resources 由根工程 mods{} 的 "coe_integration" 条目合并进根 mod 文件；
//      本模块是 GAME 层的另一个自动模块，按 JPMS 规则读得到同层模块的包。
//
// ② 外部编译面必须**自己重抄**：core 的 create / registrate / ponder / flywheel / jei
//    全是 compileOnly，而 compileOnly **不传递**（P3v §4e 实测）。
//
// ③ skiller（P4e：从 compileOnly 改成 jarJar(implementation(...))）。
//    · 上一轮实测：coe.jar 里 com/leaf/skiller/ 条目 = 0，而本模块有 31 个文件直接
//      `import com.leaf.skiller.*`（实测计数；技能条目/策略/客户端界面）⇒ 单独把 coe.jar 丢进 mods/
//      必 NoClassDefFoundError。只 compileOnly 只能保证**根 jar** 里有 skiller
//      （根 build.gradle 自己那行 jarJar(implementation("com.leaf:skiller:1.0.0"))），
//      救不了单独发布的本模块。
//    · 现在本模块**自己嵌一份** skiller（形态与根那行逐字同款），本 jar 才自足。
//    · 为什么不会造成「重复 mod」（**实测 + 源码**，不是推测）：
//      root jar 第 1 层有 skiller，本模块内层也有一份（路径都是
//      "META-INF/jarjar/skiller-1.0.0.jar"，实测 SHA256 逐字节相同 D39281CC…）；
//      `ContainedJarMetadata` 的去重键是 (identifier, version, path, isObfuscated)，
//      三要素相同 ⇒ 两份塌成一个候选，`JarSelector.select()` 只产出一份，
//      `pipeline.addModFile` 因此**只登记一个** skiller mod 文件（不会 duplicate_mod）。
//      ⚠ 这依赖「内层副本与第 1 层副本版本/路径完全一致」——将来若两处 skiller 版本不同，
//      就会变成两份**不同**的 candidate，`select()` 会按版本区间挑一个（HashMultimap 顺序、
//      不保证是第 1 层那份）。所以升级 skiller 必须**根与本模块同时改**，只改一处是雷。
//    · 单独装本模块时它是第 1 层，正常生效。
//      实测见 build/patch/p4e-EVIDENCE.txt。
//
// ④ P7a：**Curios 与 Jade 的编译面必须补上**（旧注释写"那些包仍然住在根工程"，已不成立）。
//    P7a 把 compat/curios/**、compat/jade/**、compat/jei/** 整体搬进本模块，这些类直接
//    import top.theillusivec4.curios.api.* 与 snownee.jade.api.*，所以编译期必须在场。
//    两个都是 **compileOnly**（与根工程同口径：可选依赖，绝不进发布依赖、绝不 jarJar）：
//      · Curios：由 mods.toml 的 type=optional 声明，运行期由 CreateOreExpansion#bootstrapCurios
//        的 Class.forName 隔离加载（未装时凝能佩降级为普通物品）；
//      · Jade：同理，由 bootstrapJade 的 Class.forName 隔离加载。
//    dev 运行期这两个的实例来自**根工程**的 runtimeOnly / localRuntime（runData / runClient
//    用的是根工程的运行时类路径），所以本模块不需要 runtimeOnly。
dependencies {
    // P4d：本模块 jar 要**自足**（单独丢进玩家 mods/ 也能跑），所以自己嵌一份 core。
    // 形态与根逐字同款：jarJar(...) 的参数用 implementation(...) —— 它同时给到编译可见性，
    // 所以原来的 compileOnly(project(':core')) 已删除（留着＝同一个依赖声明两遍，见根 build.gradle 同款说明）。
    // 为什么不会像 :coe 之于根那样触发 duplicate_mod：core **不是 mod**（coe_library=true，没有
    // META-INF/neoforge.mods.toml），它的 jar 落到 runtimeClasspath 上只是个普通库，FML 不会把它当 mod 文件。
    jarJar(implementation(project(':core')))

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    // 编译期用 JEI API、运行期用完整 JEI jar（与根工程同配方；compat/jei/coe/** 属于 COE）
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    // CC&A：compat/createaddition/** 属于 COE（锭→板/杆/线整条线跑在它的轧机上）
    compileOnly("curse.maven:createaddition-439890:8083378")
    runtimeOnly("curse.maven:createaddition-439890:8083378")

    // Curios（可选集成）：compat/curios/CurioMedallionBridge / CurioMedallionItems 直接
    // import top.theillusivec4.curios.api.*。P7a 起这两个类住本模块（原先住根工程）。
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"

    // Jade（可选集成）：compat/jade/BasinLiveItemStorage / BasinLiveJadePlugin 直接
    // implement snownee.jade.api.*。P7a 起住本模块；运行期由 bootstrapJade 的 Class.forName 隔离。
    compileOnly("maven.modrinth:jade:15.8.3+neoforge")

    // 技能内核 Skiller（P4e）：本模块有 31 个文件直接 import com.leaf.skiller.*（实测计数），
    // 所以它必须随本 jar 一起发布 —— jarJar(...) 把 skiller-1.0.0.jar 嵌进本 jar 的
    // META-INF/jarjar/；参数用 implementation(...) 同时给到编译可见性，
    // 于是原来的 compileOnly("com.leaf:skiller:1.0.0") 已删除（留着＝同一个依赖声明两遍）。
    // 坐标与根 build.gradle 那行逐字同源（同一个本地 maven 仓库 libs-maven/）。
    jarJar(implementation("com.leaf:skiller:1.0.0"))
}
