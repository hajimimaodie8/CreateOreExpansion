# ${mod_name} — NeoForge 模块元数据模板（P3a 骨架 → P3z 落地）
#
# 本模块 = **cews（能量波阵学 CEWS）自己的 mod 文件**（P3z 起）。
# 由 buildSrc 的 coe-conventions 插件在 processResources 时展开 TOML 占位符：
#   模板：<module>/src/main/templates/META-INF/neoforge.mods.toml
#   展开：<module>/build/generated/sources/modMetadata/META-INF/neoforge.mods.toml
# mod_id = cews（mod id 分家），但**注册命名空间仍是 createoreexpansion**
# （common/CoeCore#REGISTRY_NAMESPACE）：注册 id / 语言键 / 配置键 / 数据包路径一个都没变。
#
# 根工程的模板（src/main/templates/...）**只声明 coe_integration**（根工程自己的集成层
# mod 入口），不再声明本 id；同一个 mod id 出现在两个 mod 文件里会被 UniqueModListBuilder
# 判 duplicate_mod 硬崩。
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

# ============================ cews（能量波阵学 CEWS） ============================
# 本段与根模板原先那段**逐字对齐**：同样的 modId / version / displayName / authors /
# description 字段顺序 —— 本模块 gradle.properties 里
#   mod_id=cews / mod_name=Create: Energy Wave Studies / mod_version=1.0.0 /
#   mod_authors=hjmmd_8, Leaf / description=An expansion for create mod,add more ore block and more.
# 展开后的值与根模板里那几行字面量逐字节相同；
# 依赖集合与顺序也相同（neoforge / minecraft / create required、jei / curios optional、
# createaddition required、createoreexpansion **required** + AFTER）。
# W6-c 更正一处过时口径：这条模块间依赖原为 optional，现为 required（理由见文件末尾那段）。
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# ── [[mixins]]：本模块**没有**（P7b 复核结论）──────────────────────────────────────────
# P7b 起 mixin 配置跟着类走：本工程 7 个 mixin 类 + 1 个配置插件**全部**住在 :coe，
# 所以 [[mixins]] 声明与 createoreexpansion.mixins.json 都在 :coe
# （coe/src/main/templates/META-INF/neoforge.mods.toml + coe/src/main/resources/）。
# CEWS 的文件里**一个 mixin 类都没有**（实测：cews/src/main/java 下无 mixin/ 包），
# 所以本模块既不声明 config、也不带 *.mixins.json —— 刻意不造空配置：
# 声明一个不存在（或指向别层）的 config 会让 MixinConfig.create 在加载期抛
# IllegalArgumentException，而"在这里再声明一次同一个 config"等于把它注册两遍。

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Create 是四个模块共同的底座（版本区间沿用根工程那份的写法）
[[dependencies."${mod_id}"]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.1.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "jei"
type = "optional"
versionRange = "[19.27.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "curios"
type = "optional"
versionRange = "[9.5.1,)"
ordering = "NONE"
side = "BOTH"

# CC&A 对 CEWS 是 **required**（与拆分前根模板里那条逐字相同）
[[dependencies."${mod_id}"]]
modId = "createaddition"
type = "required"
versionRange = "[1.5.11,)"
ordering = "NONE"
side = "BOTH"

# ── 模块间依赖：cews → createoreexpansion 是 **required**（W6-c 起）───────────────────
# CEWS 单向依赖 COE（材料：星辉石/蓝宝石/翡翠部件；W6-c 之后还依赖波引擎本身：
# 两个能量波实体类型、三台应力充能器、energy field、wave/api、charging 配方类型全在 :coe）。
# **这条依赖从 optional 改成 required 是本轮依赖矩阵的裁定**，理由是 W5 的实测结论：
# "optional"是一句假话——CEWS 的机器/波实体真的需要 COE 的类，单装 cews.jar 的后果是
# **NoClassDefFoundError**（构造期崩，玩家看不懂）。改成 required 之后 FML 在**加载期**
# 就拒绝，报人话：`Missing or unsupported mandatory dependencies: Mod cews requires
# createoreexpansion 1.0.0 or above`。这正是"改对了"的标志（与 transmutation 那条同形）。
# createoreexpansion 由**另一个**嵌套 mod 文件（:coe 的 jar）声明 —— FML 的依赖图按
# mod id 建，不按文件，所以跨文件声明照样生效。
# 反过来 CEWS 不声明 transmutation：本层必须能在没有 TRANS 的情况下安装
# （tools/check-layering.ps1 的 CEWS->TRANS 禁止方向）。
[[dependencies."${mod_id}"]]
modId = "createoreexpansion"
type = "required"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"
